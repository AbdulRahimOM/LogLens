<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>LogLens — Live Logs</title>
  <link rel="stylesheet" href="styles.css?v=outer-grid-scrollbar-1">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">L</span><div><h1>LogLens</h1><p>Live service logs</p></div></div>
      <div class="connection" aria-live="polite" aria-atomic="true"><span class="connection-dot" id="connection-dot"></span><span id="connection-status">Connecting</span><span id="connection-detail" class="muted"></span></div>
    </header>

    <section id="notice" class="notice" role="status" hidden></section>
    <section class="toolbar" aria-label="Log filters and display options">
      <div class="filter service-filter" id="service-filter-container">
        <span class="filter-label">Services</span>
        <button id="service-filter-toggle" class="service-filter-toggle" type="button" aria-controls="service-filter-menu" aria-expanded="false">
          <span id="service-filter-summary">All services</span><span aria-hidden="true">⌄</span>
        </button>
        <fieldset class="service-menu" id="service-filter-menu" aria-label="Filter by services" hidden></fieldset>
      </div>
      <label class="filter search-filter">Message <input id="message-search" type="search" placeholder="Search messages" autocomplete="off" spellcheck="false"></label>
      <div class="filter level-filter" id="level-filter-container">
        <span class="filter-label">Levels</span>
        <button id="level-filter-toggle" class="level-filter-toggle" type="button" aria-controls="level-filter-menu" aria-expanded="false">
          <span id="level-filter-summary">3 selected</span><span aria-hidden="true">⌄</span>
        </button>
        <fieldset class="level-menu" id="level-filter-menu" aria-label="Filter by log levels" hidden>
          <label><input type="checkbox" name="level-filter" value="TRACE"> Trace</label>
          <label><input type="checkbox" name="level-filter" value="DEBUG"> Debug</label>
          <label><input type="checkbox" name="level-filter" value="INFO" checked> Info</label>
          <label><input type="checkbox" name="level-filter" value="WARN" checked> Warn</label>
          <label><input type="checkbox" name="level-filter" value="ERROR" checked> Error</label>
          <label><input type="checkbox" name="level-filter" value="UNKNOWN"> Unknown</label>
        </fieldset>
      </div>
      <div class="view-switch" role="group" aria-label="Log layout"><button id="combined-view" class="active" type="button" aria-pressed="true">Combined</button><button id="separated-view" type="button" aria-pressed="false">Separated</button></div>
      <div class="log-actions" role="group" aria-label="Log viewing controls">
        <button id="pause-toggle" type="button" aria-pressed="false">Pause</button>
        <label class="auto-scroll-control"><input id="auto-scroll" type="checkbox" checked> Auto-scroll</label>
        <button id="clear-logs" type="button">Clear</button>
      </div>
    </section>
    <div class="buffer-notices">
      <span id="paused-status" class="buffer-notice paused-status" hidden></span>
      <span id="dropped-status" class="buffer-notice dropped-status" hidden></span>
    </div>
    <div id="status-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

    <section class="workspace" aria-label="Log events">
      <div class="empty-state" id="empty-state" role="status" aria-live="polite" aria-atomic="true"><span class="empty-icon" aria-hidden="true">⌁</span><h2 id="empty-title">Loading services</h2><p id="empty-message">Fetching configured sources from LogStreamer.</p></div>
      <div id="log-view" class="log-view" aria-live="off"></div>
      <div id="grid-scrollbar" class="grid-scrollbar" role="scrollbar" aria-label="Separated logs grid" aria-controls="log-view" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="No scrolling needed" tabindex="0" hidden><div id="grid-scrollbar-thumb" class="grid-scrollbar-thumb"></div></div>
    </section>
    <footer><span id="event-count">0 events</span><span>Recent events · in-memory buffer: 500 per service</span></footer>
  </main>
  <script src="config.js"></script>
  <script type="module" src="app.js?v=outer-grid-scrollbar-1"></script>
</body>
</html>
